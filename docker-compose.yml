# Causality — one-command local stack.
#
#   cp .env.example .env   # add your ANTHROPIC_API_KEY
#   docker compose up       # → frontend http://localhost:5173, API http://localhost:8000
#
# Source is bind-mounted so edits hot-reload without a rebuild.

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # Pulled from your shell or the .env file; required by the pipeline.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Optional model override — falls back to the code default when unset in .env.
      # (An empty value would override the code default, so default it here too.)
      - CAUSALITY_MODEL=${CAUSALITY_MODEL:-claude-sonnet-4-6}
      # Server-side import dir: OTLP/Jaeger trace files dropped here are auto-loaded.
      - CAUSALITY_IMPORT_DIR=/app/data/imports
      - DATABASE_URL=postgresql+psycopg://causality:causality@postgres:5432/causality
      - REDIS_URL=redis://redis:6379/0
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_SECURE=false
      - CLICKHOUSE_DATABASE=causality
      - CLICKHOUSE_USER=causality
      - CLICKHOUSE_PASSWORD=causality
      - SESSION_SECRET=local-compose-session-secret
    volumes:
      - ./backend/app:/app/app
      # "Where you'd store a logfile" — drop trace JSON here and it appears on restart.
      - ./data/imports:/app/data/imports
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      clickhouse: { condition: service_healthy }

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      # Browser talks to the backend on the host-published port.
      - VITE_API_BASE=${VITE_API_BASE:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      # Keep the image's node_modules — don't let the host dir shadow it.
      - /app/node_modules

  worker:
    build: ./backend
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CAUSALITY_MODEL=${CAUSALITY_MODEL:-claude-sonnet-4-6}
      - DATABASE_URL=postgresql+psycopg://causality:causality@postgres:5432/causality
      - REDIS_URL=redis://redis:6379/0
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_SECURE=false
      - CLICKHOUSE_DATABASE=causality
      - CLICKHOUSE_USER=causality
      - CLICKHOUSE_PASSWORD=causality
    volumes:
      - ./backend/app:/app/app
    command: celery -A app.tasks.celery worker --loglevel=INFO --concurrency=2
    depends_on:
      backend: { condition: service_started }
      redis: { condition: service_healthy }
      clickhouse: { condition: service_healthy }

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: causality
      POSTGRES_PASSWORD: causality
      POSTGRES_DB: causality
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U causality"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: causality
      CLICKHOUSE_USER: causality
      CLICKHOUSE_PASSWORD: causality
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "causality", "--password", "causality", "--query", "SELECT 1"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  redis-data:
  clickhouse-data:
